const _inflight=new Map();
async function api(path,opt={}){
 const key=(opt.method||'GET')+' '+path+(opt.body||''),share=path!=='/api/trendyol/engagement';
 if(share&&_inflight.has(key))return _inflight.get(key);
 const job=(async()=>{let last;for(let i=0;i<4;i++){const r=await fetch(path,{cache:'no-store',...opt});let d={};try{d=await r.json()}catch{}if(r.ok)return d;last=new Error(d.error||`HTTP ${r.status}`);if(r.status!==429)throw last;await new Promise(x=>setTimeout(x,2000*Math.pow(2,i)));}throw last})();
 if(share)_inflight.set(key,job);try{return await job}finally{if(share)_inflight.delete(key)}
}

const ELIFE_DB_NAME='ELIFE_SHOP_CACHE_V2'+(window.ZosezScope?.dbSuffix||''),ELIFE_DB_VERSION=1,ELIFE_STORE='cache';
let _elifeDbPromise=null;
function openElifeDB(){if(_elifeDbPromise)return _elifeDbPromise;_elifeDbPromise=new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB desteklenmiyor'));return}const req=indexedDB.open(ELIFE_DB_NAME,ELIFE_DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(ELIFE_STORE))db.createObjectStore(ELIFE_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('IndexedDB açılamadı'))});return _elifeDbPromise}
async function idbGet(key){const db=await openElifeDB();return new Promise((resolve,reject)=>{const tx=db.transaction(ELIFE_STORE,'readonly'),r=tx.objectStore(ELIFE_STORE).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbSet(key,value){const db=await openElifeDB();return new Promise((resolve,reject)=>{const tx=db.transaction(ELIFE_STORE,'readwrite');tx.objectStore(ELIFE_STORE).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}

async function engagementBatch(batch,force=false){
 TrendyolInteractions.range(reportStart,reportEnd);
 const key=reportStart+'|'+reportEnd,generation=reportGeneration,period={start:reportStart,end:reportEnd};
 if(!force&&reportCache?.key===key&&Date.now()-reportCache.at<300000)return reportCache.data;
 if(reportPending?.generation===generation)return reportPending.promise;
 const promise=(async()=>{
  const rows=await TrendyolInteractions.collectPages(async page=>{
   if(generation!==reportGeneration)throw Error('Rapor ayarları değişti; yeniden deneyin.');
   return api('/api/trendyol/engagement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page,pageSize:20,startDate:period.start,endDate:period.end})});
  },(pages,count)=>{state.engagementResult=`${pages} sayfa · ${count} rapor satırı alındı`;if(state.engagementLoading)render()});
  if(generation!==reportGeneration)throw Error('Rapor ayarları değişti; eksik sonuç uygulanmadı.');

 })();

}

 const message=$('#reportSettingsMessage'),button=$(mode==='seller-api'?'#reportApiButton':'#reportSaveButton');
 reportSettingsBusy=true;if(button)button.disabled=true;

 // Secrets only travel in this same-origin POST; never echo them or persist them in JS storage.

function lineChart(data=[]){
  const rows=(data||[]).map(x=>({date:x.date||'-',orders:Number(x.orders??x.sales??0),revenue:Number(x.revenue||0)}));
  if(!rows.length)return '<div class="empty-state">Son 30 gün için grafik verisi yok</div>';
  const totalOrders=rows.reduce((s,x)=>s+x.orders,0),totalRevenue=rows.reduce((s,x)=>s+x.revenue,0);
  const w=900,h=240,pad=28, maxO=Math.max(1,...rows.map(x=>x.orders)), maxR=Math.max(1,...rows.map(x=>x.revenue));
  const step=(w-pad*2)/Math.max(1,rows.length-1), bw=Math.max(5,Math.min(20,step*.55));
  const pts=rows.map((x,i)=>`${pad+i*step},${h-pad-(x.orders/maxO)*(h-pad*2)}`).join(' ');
  const bars=rows.map((x,i)=>{const bh=(x.revenue/maxR)*(h-pad*2),xx=pad+i*step-bw/2,yy=h-pad-bh;return `<rect x="${xx}" y="${yy}" width="${bw}" height="${bh}" rx="3" fill="#14b8a6" opacity=".28"><title>${esc(x.date)} • Sipariş: ${fmt(x.orders)} • Ciro: ${money(x.revenue)} TL</title></rect>`}).join('');
  const dots=rows.map((x,i)=>{const xx=pad+i*step,yy=h-pad-(x.orders/maxO)*(h-pad*2);return `<circle cx="${xx}" cy="${yy}" r="5" fill="#f97316" stroke="white" stroke-width="2"><title>${esc(x.date)} • Sipariş: ${fmt(x.orders)} • Ciro: ${money(x.revenue)} TL</title></circle>`}).join('');
  const labels=rows.map((x,i)=>i%Math.max(1,Math.ceil(rows.length/6))===0?`<text x="${pad+i*step}" y="${h-5}" text-anchor="middle" font-size="11" fill="#64748b">${esc(String(x.date).replace(/\.\d{4}$/,''))}</text>`:'').join('');
  return `<div class="flex wrap" style="gap:10px;margin-bottom:12px"><span class="metric-pill">📦 Toplam Sipariş: <b>${fmt(totalOrders)}</b></span><span class="metric-pill">💰 Toplam Ciro: <b>${money(totalRevenue)} TL</b></span><span class="small muted">● Turuncu: Sipariş &nbsp; ▮ Yeşil: Ciro · Noktanın üzerine gelin</span></div><svg viewBox="0 0 ${w} ${h}" class="chart" preserveAspectRatio="none">${bars}<polyline fill="none" stroke="#f97316" stroke-width="4" points="${pts}"/>${dots}${labels}</svg>`
}

function mergeOrderRows(existing,incoming){
  const market=o=>String(o.marketplaceCode||'TY1').toUpperCase();
  const packageId=o=>o.shipmentPackageId??o.packageId??o.raw?.shipmentPackageId??o.raw?.id;
  const orderId=o=>String(o.orderNumber??'');
  const valid=o=>o&&typeof o==='object'&&orderId(o)&&orderId(o)!=='-';
  const key=o=>market(o)+'|'+(packageId(o)!=null?'package:'+packageId(o):'order:'+orderId(o));
  const modified=o=>Number(o.lastModifiedDate||o.raw?.packageLastModifiedDate||o.raw?.packageModificationDate||o.raw?.lastModifiedDate||0);
  const rows=new Map();
  for(const o of Array.isArray(existing)?existing:[])if(valid(o))rows.set(key(o),o);
  for(const o of Array.isArray(incoming)?incoming:[]){
    if(!valid(o))continue;
    const k=key(o);let previous=rows.get(k),previousKey=k;
    if(!previous){
      const matches=[...rows].filter(([,old])=>market(old)===market(o)&&orderId(old)===orderId(o));
      if(matches.length===1&&(packageId(o)==null||packageId(matches[0][1])==null)){
        [previousKey,previous]=matches[0];
      }
    }
    if(previous&&modified(o)&&modified(previous)&&modified(o)<modified(previous))continue;
    const merged={...previous,...Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined))};
    // An aggregate update must not discard a known shipment identity.
    if(previous&&packageId(o)==null&&packageId(previous)!=null)merged.shipmentPackageId=packageId(previous);
    if(previous)rows.delete(previousKey);
    rows.set(key(merged),merged);
  }
  return [...rows.values()].sort((a,b)=>(Number(b.timestamp)||0)-(Number(a.timestamp)||0));
}

function productAllDataHtml(p){const labels={id:'Stok Kodu / ID',name:'Ürün Adı',category:'Kategori',price:'Satış Fiyatı',stock:'Stok',sales30d:'30 Gün Satış',grossFavorites:'Brüt Favori',addToBasket:'Sepete Ekleme',favorites:'Aktif Favori',comments:'Yorum',views:'Görüntülenme',viewsPeriodDays:'Görüntülenme Dönemi (gün)',engagementSource:'Etkileşim Kaynağı',engagementUpdatedAt:'Etkileşim Güncelleme',impressions:'Gösterim',cartCount:'Sepette',rating:'Puan',buyboxRank:'Öne Çıkan Teklif Sırası',buyboxPrice:'Öne Çıkan Teklif Fiyatı',hasMultipleSeller:'Çoklu Satıcı',lastCity:'Son Kargo İli',status:'Durum',barcode:'Barkod',description:'Açıklama',viewsPeriodDays:'Görüntülenme Dönemi',image:'Ana Görsel'};const rows=[];const seen=new Set();const add=(k,v,prefix='')=>{if(v===undefined||v===null||v===''||typeof v==='object'||typeof v==='function')return;const kk=prefix+k;if(seen.has(kk))return;seen.add(kk);rows.push([labels[k]||kk,String(v)])};for(const [k,v] of Object.entries(p||{})){if(['raw','images'].includes(k))continue;add(k,v)}const raw=p?.raw&&typeof p.raw==='object'?p.raw:{};for(const [k,v] of Object.entries(raw)){if(typeof v!=='object'||v===null)add(k,v,'API · ')}const json=JSON.stringify(raw,null,2);return `<details class="product-all-data"><summary>Tüm Ürün Verileri · ${rows.length} alan</summary><div class="product-data-grid">${rows.map(([k,v])=>`<div class="product-data-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>${json&&json!=='{}'?`<details style="margin:0 12px 12px"><summary style="cursor:pointer;font-size:11px;font-weight:800;color:#64748b">Ham API verisini göster</summary><pre class="product-raw-json">${esc(json)}</pre></details>`:''}</details>`}

function recoNum(v){const n=Number(v);return Number.isFinite(n)?n:0}
function recoClamp(min,max,v){return Math.max(min,Math.min(max,v))}
function recoStats(){const active=(state.products||[]).filter(p=>recoNum(p.stock)>0),sales=active.map(p=>recoNum(p.sales30d)).sort((a,b)=>a-b),q=(x)=>sales.length?sales[Math.min(sales.length-1,Math.max(0,Math.floor((sales.length-1)*x)))]:0;return {p50:q(.50),p80:q(.80),p90:q(.90)}}
function productPromoRecommendation(p,stats=recoStats()){
 const sold=recoNum(p.sales30d),stock=recoNum(p.stock),returns=Math.max(0,recoNum(v101ProductReturnQty(p))),rate=sold>0?returns/sold*100:0,views=recoNum(p.views),favorites=recoNum(p.favorites),price=recoNum(p.price),favGap=favorites>Math.max(5,sold*4),viewGap=views>Math.max(80,sold*30);
 if(stock<=0)return {priority:'hold',priorityLabel:'Beklet',type:'Kampanya önerilmez',offer:'Önce stok yenileyin',duration:'—',reason:'Stok sıfır olduğu için indirim satışa dönüşemez.'};
 if(rate>=15)return {priority:'high',priorityLabel:'Önce düzelt',type:'Kampanyayı beklet',offer:'İade nedeni + içerik kontrolü',duration:'3–7 gün kontrol',reason:`İade oranı %${money(rate)}. İndirimden önce iade kaynağını azaltın.`};
 if(sold===0){const disc=recoClamp(7,12,7+(stock>20?2:0)+(price>500?1:0));return {priority:'high',priorityLabel:'Yüksek',type:favGap?'Favoriyi satışa çevir':'İlk satış kampanyası',offer:`Sepette %${disc} indirim / kupon testi`,duration:'7 gün',reason:favGap?'Favori ilgisi var ama satış yok; düşük riskli dönüşüm teşviki deneyin.':'30 gündür satış yok; kısa süreli ilk satış testi önerilir.'}}
 if(viewGap&&sold<Math.max(3,stats.p50)){const disc=recoClamp(5,10,5+(stock>15?2:0)+(price>750?1:0));return {priority:'high',priorityLabel:'Yüksek',type:'Dönüşüm kampanyası',offer:`%${disc} sepette indirim + kupon`,duration:'7 gün',reason:'Görüntülenme satışa göre yüksek; teklif/fiyat dönüşümünü test edin.'}}
 if(sold>=stats.p80&&rate<5){const disc=recoClamp(3,6,3+(stock>sold?1:0));return {priority:'low',priorityLabel:'Koru',type:stock>sold*1.5?'Hacim kampanyası':'Satışı koruma',offer:stock>sold*1.5?`2+ adet için %${disc} avantaj`:`Maks. %${disc} kontrollü indirim`,duration:'5–7 gün',reason:'Ürün zaten güçlü satıyor; marjı bozmadan hacmi koruyun.'}}
 if(stock>Math.max(20,sold*3)){const disc=recoClamp(6,10,6+(stock>50?2:0));return {priority:'medium',priorityLabel:'Orta',type:'Stok eritme kampanyası',offer:`%${disc} fiyat avantajı / çoklu alım`,duration:'7–10 gün',reason:'Stok satış hızına göre yüksek; kontrollü stok devir testi uygun.'}}
 return {priority:'medium',priorityLabel:'Orta',type:'Dengeli satış kampanyası',offer:`%${recoClamp(4,7,4+(favorites>sold*2?1:0))} sepette avantaj`,duration:'5–7 gün',reason:'Satış var; küçük teşvikle dönüşüm artışı ölçülebilir.'}
}
function productAdRecommendation(p,stats=recoStats()){
 const sold=recoNum(p.sales30d),stock=recoNum(p.stock),returns=Math.max(0,recoNum(v101ProductReturnQty(p))),rate=sold>0?returns/sold*100:0,views=recoNum(p.views),favorites=recoNum(p.favorites),price=Math.max(1,recoNum(p.price)),comments=recoNum(p.comments),rating=recoNum(p.rating);
 if(stock<=0)return {priority:'hold',priorityLabel:'Beklet',type:'Reklam önerilmez',goal:'Stok gelmesini bekle',budget:0,period:'—',reason:'Stok yok; reklam bütçesi harcamayın.'};
 if(rate>=15)return {priority:'high',priorityLabel:'Önce düzelt',type:'Reklamı beklet',goal:'İade sorununu çöz',budget:0,period:'3–7 gün kontrol',reason:`İade oranı %${money(rate)}; yeni trafik sorunu büyütebilir.`};
 let factor=sold===0?.28:sold>=stats.p80?.75:sold>=stats.p50?.52:.38; if(views<50)factor+=.08;if(favorites>sold*4)factor+=.05;if(rating>=4.5&&comments>=10)factor+=.06;
 const budget=Math.round(recoClamp(50,600,price*factor)/10)*10;
 if(sold===0)return {priority:'high',priorityLabel:'Yüksek',type:'Keşif ürün reklamı',goal:'İlk sipariş + veri toplama',budget,period:'5–7 gün',reason:views>100?'Trafik var ancak satış yok; reklamı küçük bütçeyle teklif değişikliğiyle birlikte test edin.':'Görünürlük düşük ve satış yok; kontrollü keşif testi yapın.'};
 if(sold>=stats.p80&&rate<5)return {priority:'medium',priorityLabel:'Büyüt',type:'Satışı koruma reklamı',goal:'Güçlü üründe görünürlüğü koru',budget,period:'7 gün',reason:'Satış güçlü ve iade düşük; kontrollü bütçeyle ölçekleme adayı.'};
 if(views>Math.max(100,sold*35))return {priority:'high',priorityLabel:'Yüksek',type:'Dönüşüm odaklı reklam',goal:'Trafiği satışa çevir',budget,period:'5–7 gün',reason:'Görüntülenme var; reklamı kampanya/fiyat testiyle birlikte ölçün.'};
 return {priority:'medium',priorityLabel:'Orta',type:'Kontrollü ürün reklamı',goal:'Satış ivmesini artır',budget,period:'7 gün',reason:'Orta performans; küçük bütçeli test ve 3. gün ara kontrol uygundur.'}
}
function recoFilterRows(kind){const stats=recoStats(),q=String(state.filters[kind+'RecoSearch']||'').trim().toLocaleLowerCase('tr-TR'),mode=state.filters[kind+'RecoMode']||'all';let rows=(state.products||[]).map(p=>({p,r:kind==='campaign'?productPromoRecommendation(p,stats):productAdRecommendation(p,stats)}));if(q)rows=rows.filter(x=>(`${x.p.name} ${x.p.id} ${x.p.barcode||''} ${x.p.category||''}`).toLocaleLowerCase('tr-TR').includes(q));if(mode==='high')rows=rows.filter(x=>x.r.priority==='high');if(mode==='active')rows=rows.filter(x=>x.r.priority!=='hold');if(mode==='hold')rows=rows.filter(x=>x.r.priority==='hold');const order={high:0,medium:1,low:2,hold:3};rows.sort((a,b)=>(order[a.r.priority]??9)-(order[b.r.priority]??9)||recoNum(b.p.sales30d)-recoNum(a.p.sales30d));return rows}

async function getMapTemplate(){if(_mapTemplatePromise)return _mapTemplatePromise;_mapTemplatePromise=(async()=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const r=await fetch('https://cdn.jsdelivr.net/gh/dnomak/svg-turkiye-haritasi@master/index.html',{signal:controller.signal,cache:'force-cache'});if(!r.ok)throw Error('Harita kaynağı HTTP '+r.status);const t=await r.text(),d=new DOMParser().parseFromString(t,'text/html'),base=d.querySelector('#svg-turkiye-haritasi');if(!base)throw Error('Harita SVG bulunamadı');const svg=base.cloneNode(true);svg.querySelector('#guney-kibris')?.remove();svg.querySelector('#kuzey-kibris')?.remove();return svg}finally{clearTimeout(timer)}})().catch(e=>{_mapTemplatePromise=null;throw e});return _mapTemplatePromise}

'use strict';
const D101=Decision101;
let v101={schema:1,revision:0,policy:{...D101.defaults},actions:[],audit:[],localProducts:{},costs:{},observations:[]},v101Ready=false,v101Error='',v101Selected='',v101Query='',v101Draft=null,v101Busy=false,v101SalesFilter='all',v101SalesBusy=false,v101SalesCache=null,v101ChartSelected='',v101ChartQuery='',v101ChartTimer=null;
const v101Fields={price:'Fiyat',stock:'Stok',name:'Başlık',description:'Açıklama'};
const v101Esc=esc;
const v101Val=(n,s='')=>n===null||n===undefined?'Veri yok':typeof n==='number'?n.toLocaleString('tr-TR',{maximumFractionDigits:2})+s:esc(String(n))+s;
const v101Key=s=>encodeURIComponent(String(s)).replace(/'/g,'%27');
const v101Now=()=>new Date().toISOString();
const v101Uid=()=>crypto.randomUUID();
function v101Products(){return state.products.map(p=>({...p}))}
function v101WorkingProducts(){return v101Products().map(p=>({...p,...(v101.localProducts[String(p.id)]||{})}))}
function v101Costs(){return Object.fromEntries(v101Products().map(p=>[String(p.id),{...(state.profit[String(p.id)]||{}),...(v101.costs[String(p.id)]||{})}]))}
function v101Audit(db,event,detail={}){db.audit.push({id:v101Uid(),at:v101Now(),user:null,source:'kullanıcı',event,...detail})}
async function v101Commit(fn){if(!v101Ready)throw Error('Kayıt deposu hazır değil.');const db=await openElifeDB();await new Promise((resolve,reject)=>{const tx=db.transaction(ELIFE_STORE,'readwrite'),store=tx.objectStore(ELIFE_STORE),req=store.get('decision101');let next;req.onsuccess=()=>{try{const current=req.result||{...v101,revision:0};if(current.revision!==v101.revision)throw Error('Başka sekmede kayıt değişti. Sayfayı yenileyin.');next=structuredClone(v101);fn(next);next.revision++;store.put(next,'decision101')}catch(e){reject(e);tx.abort()}};tx.oncomplete=()=>{v101=next;resolve()};tx.onerror=()=>reject(tx.error||Error('Kayıt yazılamadı.'));tx.onabort=()=>reject(Error('İşlem kaydedilmedi.'))})}
async function v101Run(fn){if(v101Busy)return;v101Busy=true;try{await fn()}catch(e){alert(e.message)}finally{v101Busy=false;render()}}
function v101Download(name,data,type='application/json'){const url=URL.createObjectURL(new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function v101Head(title){return `<div class="v101"><div class="v101-head"><div><span class="v101-eyebrow">ELIFESHOP / V101 · VERİ TABANLI KARAR MOTORU + AI</span><h1>${title}</h1><p>Gerçek veri → kanıt → senaryo → politika → onay → sonuç</p></div><span class="v101-mode">Canlı veriler · Yerel senaryolar</span></div><nav class="v101-tabs">${[['/karar-merkezi','Ürün Sağlığı'],['/satis-grafigi','Satış Grafiği'],['/ai-yol-haritasi','AI Yol Haritası'],['/onay-merkezi','SENİN ONAYIN'],['/politikalar','Koruma Politikaları'],['/islem-gecmisi','İşlem Geçmişi'],['/sonuc-merkezi','Ne yaptık, ne oldu?']].map(([url,label])=>`<a class="${state.route===url?'active':''}" href="#${url}">${label}</a>`).join('')}</nav>${!v101Ready?`<div class="notice">${esc(v101Error||'Kayıt deposu yükleniyor…')}</div>`:''}<div class="v101-note">Bu sürümde fiyat/stok/içerik uygulama ve geri alma <b>yerel çalışma kopyasında</b> çalışır. Canlı mağaza yazma servisi bağlı değildir; mağaza verisi değiştirilmez. Kayıtlar bu tarayıcıda saklanır.</div>`}
function v101Badge(s){return `<span class="v101-badge ${s==='Normal'||s==='Yüksek'||s==='İyileşti'?'ok':s==='Sorun'||s==='Yasak bölge'||s==='Kötüleşti'?'bad':s==='Veri yok'?'unknown':'warn'}">${esc(s)}</span>`}

function v101OpenScenario(encoded){const p=v101WorkingProducts().find(x=>String(x.id)===decodeURIComponent(encoded));if(!p)return;const c=v101Costs()[String(p.id)]||{};$('#overlay').innerHTML=`<div class="modal-bg"><div class="modal v101"><div class="modal-head"><h2>Yerel aksiyon senaryosu · ${esc(p.name)}</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="modal-body"><label>Değişecek alan<select id="v101Field" class="select w100" onchange="v101FieldChanged('${v101Key(p.id)}')">${Object.entries(v101Fields).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Yeni değer<input id="v101After" class="input w100" value="${esc(p.price??'')}" type="number" step="any"></label><div class="v101-form-grid">${[['cost','Alış (TL)'],['comm','Komisyon (%)'],['ship','Kargo (TL)'],['service','Hizmet (TL)']].map(([k,label])=>`<label>${label}<input id="v101_${k}" class="input w100" type="number" min="0" step="any" placeholder="Veri yok" value="${esc(c[k]??'')}"></label>`).join('')}</div><label>İşlem kaynağı<select id="v101Source" class="select"><option>kullanıcı</option><option>sistem</option><option>AI</option></select></label><label>Gerekçe<textarea id="v101Reason" class="input w100" placeholder="İşlemin amacı"></textarea></label><button class="btn btn-orange" onclick="v101Preview('${v101Key(p.id)}')">Simülasyonu hesapla</button><div id="v101Preview"></div></div></div></div>`}

function v101QueueDraft(){if(!v101Draft)return;const draft=structuredClone(v101Draft);v101Run(async()=>{await v101Commit(db=>{const evaluation=D101.evaluate(draft.changes,v101WorkingProducts(),db.policy,{...v101Costs(),...draft.costs});const a={id:v101Uid(),at:v101Now(),mode:'yerel',changes:draft.changes,reason:draft.reason,source:draft.source,user:null,status:evaluation.allowed?'Onay bekliyor':'Bloke',level:evaluation.level,evaluation,policy:structuredClone(db.policy),approval1:null,approval2:null,results:[]};db.costs={...db.costs,...draft.costs};db.actions.push(a);v101Audit(db,'Senaryo oluşturuldu',{actionId:a.id,source:a.source,reason:a.reason,changes:a.changes,result:a.status});});closeOverlay();v101Draft=null;location.hash='/onay-merkezi'})}
function v101Approval(){const items=[...v101.actions].reverse(),pg=v101Page(items,12);return v101Head('SENİN ONAYIN')+`<section class="card"><h2>Toplu işlem paketi</h2><p>Her satır için ürün ID, alan ve yeni değer. Örnek: [{"productId":"SKU","field":"stock","after":12}]. Destek: price, stock, name, description.</p><textarea id="v101Batch" class="input w100" rows="3" aria-label="Toplu işlem JSON"></textarea><button class="btn" onclick="v101BatchPreview()">Paketi değerlendir</button><div id="v101BatchResult"></div></section>${pg.shown.map(a=>`<section class="card"><div class="flex between"><h2>${esc(a.mode)} · ${a.changes.length} değişiklik</h2>${v101Badge(a.status)}</div><small>${esc(a.id)} · ${esc(a.at)} · Kaynak: ${esc(a.source)}</small>${a.changes.map(c=>`<p><b>${esc(c.productId)} · ${v101Fields[c.field]||esc(c.field)}</b> ${v101Val(c.before)} → ${v101Val(c.after)}</p>`).join('')}<p>Gerekçe: ${esc(a.reason||'Belirtilmedi')}</p>${v101Badge(a.level)}${v101Simulation(a.evaluation)}${(a.evaluation.errors||[]).map(x=>`<p class="v101-error">${esc(x)}</p>`).join('')}${['Onay bekliyor','İkinci onay bekliyor'].includes(a.status)?`<button class="btn btn-orange" onclick="v101Approve('${a.id}')">${a.status==='İkinci onay bekliyor'?'İkinci onayı ver':'İncele ve onayla'}</button> <button class="btn" onclick="v101Reject('${a.id}')">Reddet</button>`:''}${a.status==='Yerel uygulandı'?`<button class="btn" onclick="v101Undo('${a.id}')">Paketi geri alma senaryosu</button>${a.changes.length>1?a.changes.map((c,i)=>` <button class="btn" onclick="v101Undo('${a.id}',${i})">${i+1}. işlemi geri al</button>`).join(''):''}`:''}</section>`).join('')||'<section class="card">Bekleyen işlem yok.</section>'}${items.length?pager(pg.pages):''}</div>`}
function v101BatchPreview(){try{const input=JSON.parse($('#v101Batch').value);if(!Array.isArray(input)||input.length>1000)throw Error('En fazla 1000 satırlık dizi gerekli.');const products=v101WorkingProducts(),changes=input.map(c=>{const p=products.find(x=>String(x.id)===String(c.productId));return {productId:String(c.productId),field:c.field,before:p?.[c.field]??null,after:c.after}});const e=D101.evaluate(changes,products,v101.policy,v101Costs());v101Draft={changes,costs:{},source:'kullanıcı',reason:'Toplu işlem paketi'};$('#v101BatchResult').innerHTML=v101Badge(e.level)+e.errors.map(x=>`<p>${esc(x)}</p>`).join('')+changes.map(c=>`<p>${esc(c.productId)} · ${v101Fields[c.field]||esc(c.field)}: ${v101Val(c.before)} → ${v101Val(c.after)}</p>`).join('')+v101Simulation(e)+`<button class="btn" onclick="v101QueueDraft()">${e.allowed?'Paketi onaya gönder':'Engellemeyi kaydet'}</button>`}catch(e){alert(e.message)}}
function v101Approve(actionId){const a=v101.actions.find(x=>x.id===actionId);if(!a)return;const e=D101.evaluate(a.changes,v101WorkingProducts(),v101.policy,v101Costs());$('#overlay').innerHTML=`<div class="modal-bg"><div class="modal v101"><div class="modal-head"><h2>${a.status==='İkinci onay bekliyor'?'İkinci onay':'İşlem onayı'} · Yerel çalışma kopyası</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="modal-body">${a.changes.map(c=>`<p>${esc(c.productId)} · ${v101Fields[c.field]||esc(c.field)}: ${v101Val(c.before)} → ${v101Val(c.after)}</p>`).join('')}${v101Badge(e.level)}${v101Simulation(e)}<p>Canlı mağazada değişiklik yapılmaz.</p><label>Gerekçe (kritik işlemde zorunlu)<textarea id="v101ApproveReason" class="input w100">${esc(a.reason)}</textarea></label><label><input type="checkbox" id="v101Checked"> Eski/yeni değerleri ve yerel uygulama kapsamını inceledim.</label>${a.status==='İkinci onay bekliyor'?'<label>İkinci onay için ONAYLIYORUM yazın<input id="v101Second" class="input w100"></label>':''}<button class="btn btn-orange" onclick="v101Confirm('${a.id}')">${a.status==='İkinci onay bekliyor'?'İkinci onay ve yerel uygulama':'Onayla'}</button></div></div></div>`}
function v101Confirm(actionId){const checked=$('#v101Checked')?.checked,reason=$('#v101ApproveReason')?.value.trim(),second=$('#v101Second')?.value;if(!checked){alert('İnceleme kutusunu işaretleyin.');return}v101Run(async()=>{await v101Commit(db=>{const a=db.actions.find(x=>x.id===actionId);if(!a||!['Onay bekliyor','İkinci onay bekliyor'].includes(a.status))throw Error('İşlem onay beklemiyor.');const evaluation=D101.evaluate(a.changes,v101WorkingProducts(),db.policy,v101Costs());a.evaluation=evaluation;a.level=evaluation.level;if(!evaluation.allowed){a.status='Bloke';v101Audit(db,'Onay engellendi',{actionId,result:'Bloke',reason:evaluation.errors.join(' ')});return}if(evaluation.level==='Kritik'&&!reason)throw Error('Kritik işlem için gerekçe zorunlu.');a.reason=reason||a.reason;if(evaluation.level==='Kritik'&&a.status==='Onay bekliyor'){a.approval1={at:v101Now(),reason:a.reason,user:null,fingerprint:JSON.stringify({changes:a.changes,policy:db.policy,simulations:evaluation.simulations})};a.status='İkinci onay bekliyor';v101Audit(db,'İlk onay',{actionId,reason:a.reason});return}if(evaluation.level==='Kritik'&&a.approval1?.fingerprint!==JSON.stringify({changes:a.changes,policy:db.policy,simulations:evaluation.simulations})){a.status='Onay bekliyor';a.approval1=null;v101Audit(db,'Onay sıfırlandı',{actionId,reason:'Maliyet veya senaryo değişti; yeniden onay gerekli.'});return}if(evaluation.level==='Kritik'&&(!a.approval1||second!=='ONAYLIYORUM'))throw Error('İkinci onay metni gerekli.');if(evaluation.level==='Kritik')a.approval2={at:v101Now(),reason:a.reason,user:null};else a.approval1={at:v101Now(),reason:a.reason,user:null};for(const c of a.changes){db.localProducts[c.productId]??={};db.localProducts[c.productId][c.field]=c.after}a.status='Yerel uygulandı';a.appliedAt=v101Now();a.beforeSnapshots=a.changes.map(c=>({productId:c.productId,metrics:D101.metrics(v101Products().find(p=>String(p.id)===c.productId)||{}),at:a.appliedAt,period:'30 gün hareketli özet; nedensel önce/sonra değildir'}));a.followups=[3,7,14,30].map(days=>({days,dueAt:new Date(Date.parse(a.appliedAt)+days*86400000).toISOString()}));v101Audit(db,'Yerel uygulama',{actionId,source:a.source,reason:a.reason,changes:a.changes,result:a.status,rollbackOf:a.rollbackOf||null});});closeOverlay()})}
function v101Reject(actionId){v101Run(async()=>{await v101Commit(db=>{const a=db.actions.find(x=>x.id===actionId);if(!a||!['Onay bekliyor','İkinci onay bekliyor'].includes(a.status))throw Error('İşlem zaten sonuçlandı.');a.status='Reddedildi';v101Audit(db,'Reddedildi',{actionId,result:a.status})})})}
function v101Undo(actionId,index){v101Run(async()=>{await v101Commit(db=>{const a=db.actions.find(x=>x.id===actionId);if(!a||a.status!=='Yerel uygulandı')throw Error('Geri alınabilir işlem bulunamadı.');const selected=index===undefined?a.changes:[a.changes[index]];const changes=selected.map(c=>({productId:c.productId,field:c.field,before:c.after,after:c.before}));const evaluation=D101.evaluate(changes,v101WorkingProducts(),db.policy,v101Costs()),undo={id:v101Uid(),at:v101Now(),mode:'yerel',changes,reason:'Geri alma: '+a.id,source:'kullanıcı',user:null,status:evaluation.allowed?'Onay bekliyor':'Bloke',level:evaluation.level,evaluation,rollbackOf:a.id,results:[],approval1:null,approval2:null};db.actions.push(undo);v101Audit(db,'Geri alma hazırlandı',{actionId:undo.id,changes,result:undo.status,reason:undo.reason})});location.hash='/onay-merkezi'})}
const v101PolicyLabels={maxDiscount:'En fazla indirim (%)',maxIncrease:'En fazla zam (%)',criticalPrice:'İkinci onay eşiği (%)',minMargin:'Minimum katkı marjı (%)',maxStockDelta:'En fazla stok değişimi (adet)',maxBatch:'En fazla paket satırı',criticalBatch:'İkinci onay paket eşiği'};
function v101Policies(){return v101Head('Koruma Politikaları')+`<section class="card"><p><b>Bilgi:</b> teşhis ve simülasyon; veri değiştirmez. <b>Kontrollü:</b> sınırlar içinde tek onay. <b>Kritik:</b> ikinci onay ve gerekçe. <b>Yasak bölge:</b> limit/marj/veri ihlalinde uygulanamaz.</p><div class="v101-form-grid">${Object.entries(v101PolicyLabels).map(([k,label])=>`<label>${label}<input id="pol_${k}" type="number" min="0" step="any" class="input w100" value="${v101.policy[k]}"></label>`).join('')}</div><label><input id="pol_allowZeroStock" type="checkbox" ${v101.policy.allowZeroStock?'checked':''}> Stok sıfırlamaya kritik onayla izin ver</label><label>Politika değişikliği gerekçesi<textarea id="pol_reason" class="input w100"></textarea></label><button class="btn btn-orange" onclick="v101SavePolicy()">Politikayı kaydet</button><p class="muted">Bekleyen tüm onaylar güncel politikaya göre yeniden değerlendirilir. İkinci onay aynı operatörün ikinci adımıdır; ayrı kullanıcı kimliği doğrulanmaz. Yerel kayıtlar sunucu tarafı yetkilendirme yerine geçmez.</p></section></div>`}
function v101SavePolicy(){const p=Object.fromEntries(Object.keys(v101PolicyLabels).map(k=>[k,D101.number($('#pol_'+k).value)]));p.allowZeroStock=$('#pol_allowZeroStock').checked;const reason=$('#pol_reason').value.trim();v101Run(async()=>{D101.validatePolicy(p);if(!reason)throw Error('Politika değişikliği gerekçesi gerekli.');await v101Commit(db=>{v101Audit(db,'Politika değişikliği',{before:db.policy,after:p,reason,result:'Kaydedildi'});db.policy=p;for(const a of db.actions)if(a.status==='İkinci onay bekliyor'){a.status='Onay bekliyor';a.approval1=null;a.approval2=null}})})}
function v101History(){const items=[...v101.audit].reverse(),pg=v101Page(items,25);return v101Head('İşlem Geçmişi / Audit Log')+`<section class="card"><button class="btn" onclick="v101Download('ELIFESHOP_V101_kayitlar.json',v101)">Kayıtları JSON indir</button><p>Operatör kimliği bağlı değilse kullanıcı “bilinmiyor” olarak kaydedilir. Bu yerel denetim kaydı değiştirilemez sunucu günlüğü değildir.</p>${pg.shown.map(a=>`<details><summary>${esc(a.at)} · ${esc(a.event)} · ${esc(a.result||'Kaydedildi')}</summary><pre>${esc(JSON.stringify(a,null,2))}</pre></details>`).join('')||'<p>Henüz işlem yok.</p>'}${items.length?pager(pg.pages):''}</section></div>`}
function v101Results(){const applied=v101.actions.filter(a=>a.appliedAt),pg=v101Page(applied,10);return v101Head('Ne yaptık, ne oldu?')+`<section class="card"><p>3 / 7 / 14 / 30 gün kontrol tarihleri saklanır. Uygulama kapalıyken görev çalışmaz. Yerel senaryolar canlı satışa etki etmez; bunlara otomatik başarı atfedilmez.</p><p>İsterseniz dışarıda gerçekleştirdiğiniz bir aksiyonu kaydedip eşit süreli, kaynaklı performans ölçümlerini karşılaştırabilirsiniz.</p><button class="btn" onclick="v101ExternalForm()">Dışarıda uygulanan aksiyonu kaydet</button></section>${pg.shown.map(a=>`<section class="card"><h2>${esc(a.reason||a.id)}</h2><p>${esc(a.appliedAt)} · ${esc(a.mode)} ${a.mode==='yerel'?v101Badge('Canlı etki ölçülemez'):''}</p><div class="v101-form-grid">${(a.followups||[]).map(f=>`<div class="v101-note"><b>${f.days}. gün</b><p>${new Date(f.dueAt).toLocaleString('tr-TR')}</p>${Date.now()>=Date.parse(f.dueAt)?'Kontrol zamanı geldi':'Bekleniyor'}</div>`).join('')}</div>${a.mode==='harici'?`<button class="btn" onclick="v101MeasureForm('${a.id}')">Önce / sonra ölçümü gir</button>`:''}${(a.results||[]).map(r=>`<div class="v101-note"><b>${r.days} gün · ${v101Badge(r.comparison.result)}</b><p>Kaynak: ${esc(r.source)}</p><table class="data-table w100"><thead><tr><th>Gösterge</th><th>Önce</th><th>Sonra</th><th>Fark</th></tr></thead><tbody>${Object.entries(r.comparison.metrics).map(([k,v])=>`<tr><td>${({sales:'Satış',views:'Görüntülenme',profit:'Kârlılık',conversion:'Dönüşüm'})[k]}</td><td>${v101Val(k==='conversion'&&v.before!==null?v.before*100:v.before,k==='conversion'?'%':'')}</td><td>${v101Val(k==='conversion'&&v.after!==null?v.after*100:v.after,k==='conversion'?'%':'')}</td><td>${v101Val(v.percent,'%')}</td></tr>`).join('')}</tbody></table><small>${esc(r.comparison.note)} Harici kayıt kullanıcı beyanıdır.</small></div>`).join('')}</section>`).join('')||'<section class="card">Henüz uygulanmış aksiyon yok.</section>'}${applied.length?pager(pg.pages):''}</div>`}
function v101ExternalForm(){$('#overlay').innerHTML=`<div class="modal-bg"><div class="modal v101"><div class="modal-head"><h2>Dışarıda uygulanan aksiyon</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="modal-body"><label>Ürün ID<input id="ext_product" class="input w100"></label><label>Yapılan değişiklik / gerekçe<textarea id="ext_reason" class="input w100"></textarea></label><label>Uygulama zamanı<input id="ext_date" type="datetime-local" class="input w100"></label><button class="btn" onclick="v101SaveExternal()">Gerçekleştirdiğim aksiyonu kaydet</button></div></div></div>`}
function v101SaveExternal(){const productId=$('#ext_product').value.trim(),reason=$('#ext_reason').value.trim(),date=$('#ext_date').value;v101Run(async()=>{const t=new Date(date);if(!productId||!reason||!Number.isFinite(t.getTime())||t.getTime()>Date.now())throw Error('Ürün, açıklama ve geçmiş uygulama zamanı gerekli.');await v101Commit(db=>{const a={id:v101Uid(),mode:'harici',at:v101Now(),appliedAt:t.toISOString(),source:'kullanıcı',reason,changes:[{productId,field:'harici',before:null,after:null}],status:'Harici uygulama beyanı',level:'Bilgi',evaluation:{errors:[],simulations:[]},results:[],followups:[3,7,14,30].map(days=>({days,dueAt:new Date(t.getTime()+days*86400000).toISOString()}))};db.actions.push(a);v101Audit(db,'Harici uygulama kaydı',{actionId:a.id,reason,result:'Kullanıcı beyanı'})});closeOverlay()})}
function v101MeasureForm(actionId){$('#overlay').innerHTML=`<div class="modal-bg"><div class="modal v101"><div class="modal-head"><h2>Eşit süreli önce / sonra ölçümü</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="modal-body"><label>Dönem<select id="measure_days" class="select">${[3,7,14,30].map(d=>`<option>${d}</option>`).join('')}</select> gün</label><p>Önce: aksiyondan hemen önceki N gün. Sonra: aksiyondan hemen sonraki N gün. Her alan bu dönem toplamını ifade eder.</p><div class="v101-form-grid">${['before','after'].map(side=>`<section><h3>${side==='before'?'Önce':'Sonra'}</h3>${[['sales','Satış adedi'],['views','Görüntülenme'],['profit','Kâr (TL)']].map(([k,l])=>`<label>${l}<input id="measure_${side}_${k}" class="input w100" type="number" step="any" placeholder="Veri yok"></label>`).join('')}</section>`).join('')}</div><label>Veri kaynağı / rapor referansı<input id="measure_source" class="input w100"></label><button class="btn" onclick="v101SaveMeasurement('${actionId}')">Karşılaştır ve kaydet</button></div></div></div>`}
function v101SaveMeasurement(actionId){const days=Number($('#measure_days').value),source=$('#measure_source').value.trim(),before={days},after={days};for(const [side,obj] of [['before',before],['after',after]])for(const k of ['sales','views','profit'])obj[k]=D101.number($('#measure_'+side+'_'+k).value);v101Run(async()=>{if(!source)throw Error('Veri kaynağı gerekli.');if([before,after].some(o=>['sales','views'].some(k=>o[k]!==null&&(o[k]<0||!Number.isInteger(o[k])))))throw Error('Satış ve görüntülenme negatif olmayan tam sayı olmalı.');await v101Commit(db=>{const a=db.actions.find(x=>x.id===actionId);if(!a||a.mode!=='harici'||![3,7,14,30].includes(days)||Date.now()<Date.parse(a.appliedAt)+days*86400000)throw Error('Ölçüm dönemi henüz tamamlanmadı.');const comparison=D101.comparePeriods(before,after);a.results.push({id:v101Uid(),at:v101Now(),days,source,before,after,comparison});v101Audit(db,'Sonuç ölçümü',{actionId,result:comparison.result,source:'kullanıcı',reason:source})});closeOverlay()})}
function v101ExportEvidence(encoded){const p=v101Products().find(p=>String(p.id)===decodeURIComponent(encoded));if(p)v101Download('ELIFESHOP_AI_kanit.json',{schema:1,instruction:'Yalnızca kanıtları yorumla; eksik veriyi uydurma. Öneriler politika ve kullanıcı onayına tabidir.',diagnosis:D101.diagnose(p,v101Products()),policy:v101.policy})}
const originalV101Render=render;
render=function(){const _focus=v101UiFocusSnapshot();state.route=(location.hash.replace(/^#/,'')||state.route||'/').split('?')[0];if(state.route==='/trendyol-raporlari')state.route='/karar-merkezi';syncNavActive();const pages={'/karar-merkezi':v101Decision,'/satis-grafigi':v101SalesChartPage,'/ai-yol-haritasi':v101AiRoadmapPage,'/onay-merkezi':v101Approval,'/politikalar':v101Policies,'/islem-gecmisi':v101History,'/sonuc-merkezi':v101Results};if(pages[state.route]){$('#app').innerHTML=pages[state.route]();queueMicrotask(()=>v101UiFocusRestore(_focus));return}originalV101Render()};
decision=v101Decision;
// V101 ürün karar motoru menüleri artık Gelir/Gider altında değil, ayrı ÜRÜN ANALİZ ana sekmesindedir.
for(const item of [['Ürün Sağlığı','/karar-merkezi','◉'],['Satış Grafiği','/satis-grafigi','📈'],['AI Yol Haritası','/ai-yol-haritasi','🤖'],['SENİN ONAYIN','/onay-merkezi','✓'],['Koruma Politikaları','/politikalar','🛡'],['İşlem Geçmişi','/islem-gecmisi','☷'],['Sonuç Merkezi','/sonuc-merkezi','↗']])if(!productAnalysis.some(x=>x[1]===item[1]))productAnalysis.push(item);
for(let i=sales.length-1;i>=0;i--)if(productAnalysis.some(x=>x[1]===sales[i][1]))sales.splice(i,1);
buildNav();
(async()=>{try{const saved=await idbGet('decision101');if(saved){if(saved.schema!==1)throw Error('Desteklenmeyen kayıt sürümü.');D101.validatePolicy(saved.policy);v101=saved}v101Ready=true}catch(e){v101Error='Kayıt deposu açılamadı; işlemler kapalı: '+e.message}render()})();
</script><script src="/platform/invoice-view.js"></script><script src="/legacy-invoice-core.js"></script><script src="/legacy-invoices.js"></script></body></html>
